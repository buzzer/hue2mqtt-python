# Hue2MQTT Default Config File

[mqtt]
# use host.docker.internal to connect to mqtt broker installed on docker host
# host = "host.docker.internal"
host = "::1"
port = 1883
enable_tls = false
force_protocol_version_3_1 = true

topic_prefix = "hue2mqtt"

[hue]
ip = "192.0.2.2"
username = "some secret here"

# Optional: human readable names in MQTT topics.
# Generate this section using: hue2mqtt --print-aliases
# [alias.light]
# LoungeLamp = "00:17:88:01:ab:cd:ef:01-02"
#
# [alias.group]
# Lounge = 3

# Optional: exit, so that a supervisor can restart Hue2MQTT.
# [watchdog]
# max_runtime_hours = 48
# mqtt_disconnect_timeout = 60
